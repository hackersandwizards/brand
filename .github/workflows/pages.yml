# Publishes the catalog build (dist/: the brand portal at the root, the element stories at
# catalog/) at https://hackersandwizards.github.io/brand/ (Benedikt 01.11., os row
# catalogue-addresses: a public repo may have a public page). The build pulls the LFS files the
# portal shows itself (catalog/files.ts), past .lfsconfig's exclusions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@v0.3.0
    permissions:
      contents: read
      pages: write
      id-token: write
