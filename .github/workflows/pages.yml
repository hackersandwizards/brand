# Publishes catalogue.html at https://hackersandwizards.github.io/brand/ (Benedikt 01.11., os row
# catalogue-addresses: a public repo may have a public page).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The catalogue shows and links the application files and emoji logos, which live in Git LFS
      # and which .lfsconfig keeps from a clone. The print masters it never links stay out. The
      # cache spares the LFS bandwidth quota on every push.
      - run: git lfs ls-files --long > lfs-ids.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('lfs-ids.txt') }}
          restore-keys: lfs-
      - run: git -c lfs.fetchexclude= lfs pull --exclude="logos/*.tif"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run catalogue
      # Every tracked file outside the dot folders but the unlinked print masters, as `bun run dev`
      # serves the checkout, and the root forwarding to the catalogue as the local server does.
      - run: |
          mkdir _site
          git ls-files -z -- ':!:.*' ':!:logos/*.tif' | xargs -0 cp --parents -t _site
          echo '<!doctype html><link rel="icon" href="logos/favicon.svg"><meta http-equiv="refresh" content="0; url=catalogue.html">' > _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
