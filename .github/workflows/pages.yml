# Owned by @hackersandwizards/scaffolding: check-structure compares this file with the skeleton of
# the pinned version, and `check-structure --fix` writes it with that version's full commit.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    uses: hackersandwizards/scaffolding/.github/workflows/pages.yml@a93db8d2c9e8e4fe61a98a03d26a704761306115 # v5.20.0
    permissions:
      contents: read
      pages: write
      id-token: write
