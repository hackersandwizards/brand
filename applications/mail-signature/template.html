<table cellpadding="0" cellspacing="0" border="0" role="presentation">
  <tr>
    <td>
      <div
        style="
          font-family: Menlo, Consolas, &quot;Courier New&quot;, monospace;
          font-size: 14px;
          line-height: 18px;
          font-weight: bold;
        "
      >
        <span style="color: #1a7285">hackers</span><span style="color: #7c849c">&amp;</span
        ><span style="color: #9333ea">wizards</span>
      </div>
      <div style="height: 4px; line-height: 4px; font-size: 4px">&nbsp;</div>
      <div
        style="
          font-family: Arial, Helvetica, sans-serif;
          font-size: 13px;
          line-height: 17px;
          font-weight: bold;
          color: #19283a;
        "
      >
        {{name}}
      </div>
      <div
        style="
          font-family: Arial, Helvetica, sans-serif;
          font-size: 12px;
          line-height: 16px;
          color: #545861;
        "
      >
        {{role}}
      </div>
      <div style="height: 6px; line-height: 6px; font-size: 6px">&nbsp;</div>
      <div
        style="
          font-family: Arial, Helvetica, sans-serif;
          font-size: 12px;
          line-height: 17px;
          color: #19283a;
        "
      >
        {{#phone}}<a
          href="tel:{{tel}}"
          style="color: #19283a; text-decoration: none; white-space: nowrap"
          >{{phone}}</a
        >&nbsp;&nbsp;<span style="color: #d0d2d8">|</span>&nbsp;&nbsp;{{/phone}}<a
          href="https://www.hackersandwizards.dev/"
          style="color: #1a7285; text-decoration: none; white-space: nowrap"
          >hackersandwizards.dev</a
        >{{#linkedin}}&nbsp;&nbsp;<span style="color: #d0d2d8">|</span>&nbsp;&nbsp;<a
          href="{{linkedin}}"
          style="color: #1a7285; text-decoration: none; white-space: nowrap"
          >LinkedIn</a
        >{{/linkedin}}
      </div>
      <div
        style="
          font-family: Arial, Helvetica, sans-serif;
          font-size: 11px;
          line-height: 15px;
          color: #545861;
          padding-top: 8px;
          max-width: 520px;
        "
      >
        hackers&amp;wizards GmbH, Sitz Hamburg, Osterstra&szlig;e&nbsp;95, 20259&nbsp;Hamburg<br />Amtsgericht
        Hamburg, HRB&nbsp;198840<br />Gesch&auml;ftsf&uuml;hrer: Benedikt Stemmildt, Stefan Munz
      </div>
    </td>
  </tr>
</table>
